<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speak - Nihongo Seekho</title>
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
  <header id="site-nav"></header>
  <main class="container">
    <div class="level-head">
      <h1>🎤 Speak: bolo aur seekho</h1>
      <p class="muted">Bolna tabhi aayega jab zor se bologe. Sharmao mat, koi nahi sun raha 😄</p>
    </div>
    <div id="support-warning"></div>
    <div class="mode-bar" id="speak-modes">
      <button class="chip" data-mode="check">🎤 Bolo & Check</button>
      <button class="chip" data-mode="shadow">🔁 Shadowing (suno aur dohrao)</button>
      <button class="chip" data-mode="role">🎭 Role-play</button>
    </div>
    <div class="panel" id="speak-panel"></div>
  </main>

  <script src="js/data/syllabus.js?v=4"></script>
  <script src="js/data/kana.js?v=4"></script>
  <script src="js/data/words.js?v=4"></script>
  <script src="js/data/phrases.js?v=4"></script>
  <script src="js/data/grammar.js?v=4"></script>
  <script src="js/data/conversations.js?v=4"></script>
  <script src="js/data/kanji.js?v=4"></script>
  <script src="js/data/tricks.js?v=4"></script>
  <script src="js/common.js?v=4"></script>
  <script src="js/content.js?v=4"></script>
  <script src="js/speak.js?v=4"></script>
</body>
</html>
